city-40'); soundBtn.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed'); } const nextBtn = document.getElementById('btn-next-step'); if (nextBtn) { nextBtn.classList.remove('opacity-50', 'pointer-events-none'); nextBtn.classList.add('shadow-lg'); } playVoicePrompt(selectedEmotionSpeech); } function playVoicePrompt(text) { if ('speechSynthesis' in window && text) { window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'ko-KR'; utterance.rate = 0.85; utterance.pitch = 1.05; window.speechSynthesis.speak(utterance); } } function replayAffirmation() { if (selectedEmotionSpeech) { playVoicePrompt(selectedEmotionSpeech); } } function requestTeacherHelp() { alert("선생님께 '함께 감정을 골라보고 싶어요' 알림을 전송했습니다. 잠시만 기다려주세요!"); }</script></main><footer class="w-full bg-surface-container-low py-2"><div class="w-full px-gutter flex flex-row items-center justify-between gap-space-md"><div class="flex items-center gap-space-sm"><span class="material-symbols-outlined text-primary text-xl">pets</span><span class="font-body-md text-body-md text-on-surface-variant">나의 마음 지킴이 • 따뜻하고 편안한 특수교육 정서 지원</span></div><div class="flex items-center gap-space-md"><span class="font-label-sm text-label-sm text-on-surface-variant">괜찮아요, 천천히 말해도 돼요</span></div></div></footer>
